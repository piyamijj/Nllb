name: APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$SRC" "out/SesliTercuman-NLLB-v0.1.0.apk"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SesliTercuman-NLLB-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Sesli Tercüman NLLB — son yapı"
          body: |
            Otomatik derlenmiş APK.

            - Sürüm: v0.1.0 (Faz 0 iskeleti)
            - Commit: `${{ github.sha }}`
            - ABI: arm64-v8a
          files: out/*.apk
          make_latest: true
          prerelease: false
